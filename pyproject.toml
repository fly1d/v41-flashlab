[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v41-flashlab"
version = "0.1.0"
description = "V41 FlashLab: dependency-light benchmarks for OpenAI-compatible chat models"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "V41 FlashLab contributors" }]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["PyYAML>=6.0", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
flashlab = "v41flash_eval.cli:main"
v41flash-eval = "v41flash_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
